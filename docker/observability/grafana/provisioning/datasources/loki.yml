apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        # Turns trace_id in a log line into a link to the trace in Jaeger.
        - name: trace
          matcherRegex: '"trace_id":"(\w+)"'
          url: 'http://localhost:16686/trace/$${__value.raw}'
          urlDisplayLabel: Open in Jaeger
