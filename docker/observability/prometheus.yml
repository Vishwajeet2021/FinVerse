global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: finverse
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:8081"]
        labels: { service: auth-service }
      - targets: ["customer-service:8082"]
        labels: { service: customer-service }
      - targets: ["transaction-service:8091"]
        labels: { service: transaction-service }
      - targets: ["account-service:8083"]
        labels: { service: account-service }
      - targets: ["wallet-service:8084"]
        labels: { service: wallet-service }
      - targets: ["payment-service:8085"]
        labels: { service: payment-service }
      - targets: ["notification-service:8086"]
        labels: { service: notification-service }
      - targets: ["fraud-service:8088"]
        labels: { service: fraud-service }
      - targets: ["audit-service:8087"]
        labels: { service: audit-service }
      - targets: ["admin-service:8089"]
        labels: { service: admin-service }
      - targets: ["reporting-service:8090"]
        labels: { service: reporting-service }
