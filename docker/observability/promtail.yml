server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Compose service name as the "service" label; skip anything that is not a compose service.
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        regex: "(.+)"
        action: keep
    pipeline_stages:
      # Services log JSON (zap). Promote level as a label; trace_id stays in the line
      # (high cardinality) and is parsed at query time or by the derived field.
      - json:
          expressions:
            level: level
      - labels:
          level:
