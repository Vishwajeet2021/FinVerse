# Routes every alert to the local alert-sink webhook. In AWS the same route would
# point at an SNS topic (docs/16-observability.md section 8); critical alerts repeat
# more often than high ones.
route:
  receiver: sink
  group_by: [alertname, service]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 1h
  routes:
    - matchers: [severity="critical"]
      receiver: sink
      repeat_interval: 15m

receivers:
  - name: sink
    webhook_configs:
      - url: http://alert-sink:8099/alert
        send_resolved: true
