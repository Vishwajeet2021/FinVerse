# Local development stack for FinVerse Phase 1 (docs/19-implementation-roadmap.md).
# Run from the repo root: docker compose -f docker/docker-compose.yml up
#
# Postgres, Redis, the Phase 1-3 services, and Jaeger live here. The frontend
# runs outside Docker via `npm run dev` (docs/18-development-workflow.md §7) —
# a hot-reloading dev server gains nothing from containerization at this stage.
# Observability (Jaeger/Prometheus/Grafana/Loki) is added in Phase 5, not here
# (docs/19-implementation-roadmap.md Phase 5) — this compose file grows with
# the roadmap rather than front-loading infrastructure nothing uses yet.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finverse
      POSTGRES_PASSWORD: finverse
      POSTGRES_DB: finverse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finverse"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      AUTH_DATABASE_URL: postgres://finverse:finverse@postgres:5432/auth_db?sslmode=disable
      AUTH_JWT_PRIVATE_KEY_PATH: /keys/auth-jwt-private.pem
      AUTH_JWT_KID: auth-dev-key-1
      AUTH_JWT_ISSUER: https://auth.finverse.local
      AUTH_JWT_AUDIENCE: finverse-api
      FRONTEND_BASE_URL: http://localhost:5173
      LOG_LEVEL: debug
      ENVIRONMENT: development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - auth_keys:/keys
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  customer-service:
    build:
      context: ..
      dockerfile: services/customer-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      CUSTOMER_DATABASE_URL: postgres://finverse:finverse@postgres:5432/customer_db?sslmode=disable
      AUTH_JWKS_URL: http://auth-service:8081/.well-known/jwks.json
      AUTH_JWT_ISSUER: https://auth.finverse.local
      AUTH_JWT_AUDIENCE: finverse-api
      # Dev-only fixed key so encrypted PAN data survives a container restart
      # instead of becoming unreadable under a freshly-generated one each time
      # (internal/service/pan_crypto.go) — not a real secret, this is fake
      # local seed data; staging/prod source this from Secrets Manager
      # (docs/11-security-standards.md §3), never from compose.
      CUSTOMER_PAN_ENCRYPTION_KEY: "GUNNDvPYbDaG2TManiQSN19tnV3GFjTrDONfaUDSFbE="
      DOCUMENTS_STORAGE_PATH: /data/documents
      AUTO_APPROVE_KYC: "true"
      LOG_LEVEL: debug
      ENVIRONMENT: development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - customer_documents:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  transaction-service:
    build:
      context: ..
      dockerfile: services/transaction-service/Dockerfile
    ports:
      - "8091:8091"
      - "9091:9091"
    environment:
      PORT: "8091"
      GRPC_PORT: "9091"
      TRANSACTION_DATABASE_URL: postgres://finverse:finverse@postgres:5432/transaction_db?sslmode=disable
      REDIS_ADDR: redis:6379
      LOG_LEVEL: debug
      ENVIRONMENT: development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8091/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  account-service:
    build:
      context: ..
      dockerfile: services/account-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      PORT: "8083"
      ACCOUNT_DATABASE_URL: postgres://finverse:finverse@postgres:5432/account_db?sslmode=disable
      REDIS_ADDR: redis:6379
      TRANSACTION_SERVICE_GRPC_ADDR: transaction-service:9091
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      AUTH_JWKS_URL: http://auth-service:8081/.well-known/jwks.json
      AUTH_JWT_ISSUER: https://auth.finverse.local
      AUTH_JWT_AUDIENCE: finverse-api
      FRONTEND_BASE_URL: http://localhost:5173
      LOG_LEVEL: debug
      ENVIRONMENT: development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  wallet-service:
    build:
      context: ..
      dockerfile: services/wallet-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      PORT: "8084"
      WALLET_DATABASE_URL: postgres://finverse:finverse@postgres:5432/wallet_db?sslmode=disable
      REDIS_ADDR: redis:6379
      TRANSACTION_SERVICE_GRPC_ADDR: transaction-service:9091
      AUTH_JWKS_URL: http://auth-service:8081/.well-known/jwks.json
      AUTH_JWT_ISSUER: https://auth.finverse.local
      AUTH_JWT_AUDIENCE: finverse-api
      FRONTEND_BASE_URL: http://localhost:5173
      LOG_LEVEL: debug
      ENVIRONMENT: development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8084/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  payment-service:
    build:
      context: ..
      dockerfile: services/payment-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      PORT: "8085"
      PAYMENT_DATABASE_URL: postgres://finverse:finverse@postgres:5432/payment_db?sslmode=disable
      REDIS_ADDR: redis:6379
      TRANSACTION_SERVICE_GRPC_ADDR: transaction-service:9091
      ACCOUNT_SERVICE_URL: http://account-service:8083
      FRAUD_SERVICE_GRPC_ADDR: fraud-service:9092
      NEFT_BATCH_SECONDS: "10"   # short batches so local demos do not wait 30s
      RAIL_FAILURE_RATE: "0"
      AUTH_JWKS_URL: http://auth-service:8081/.well-known/jwks.json
      AUTH_JWT_ISSUER: https://auth.finverse.local
      AUTH_JWT_AUDIENCE: finverse-api
      FRONTEND_BASE_URL: http://localhost:5173
      LOG_LEVEL: debug
      ENVIRONMENT: development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      fraud-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8085/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Phase 3: Notification Service consumes the event catalog with retry + DLQ
  # (docs/07-microservice-specifications.md §11, docs/20-ai-dlc-phase3.md).
  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "8086:8086"
    environment:
      PORT: "8086"
      NOTIFICATION_DATABASE_URL: postgres://finverse:finverse@postgres:5432/notification_db?sslmode=disable
      REDIS_ADDR: redis:6379
      AUTH_JWKS_URL: http://auth-service:8081/.well-known/jwks.json
      AUTH_JWT_ISSUER: https://auth.finverse.local
      AUTH_JWT_AUDIENCE: finverse-api
      FRONTEND_BASE_URL: http://localhost:5173
      # Short retry schedule so the DLQ path is observable in seconds, not minutes.
      NOTIFY_MAX_DELIVERIES: "4"
      NOTIFY_BACKOFF_BASE_MS: "1000"
      NOTIFY_BACKOFF_MAX_MS: "8000"
      LOG_LEVEL: debug
      ENVIRONMENT: development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8086/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Phase 3: Fraud Service - synchronous CheckTransaction gRPC for Payment
  # (docs/05-system-architecture.md 6.1). Velocity/daily limits are loosened
  # here so the load test is not rate-limited by its own fraud rules; the
  # code defaults (10 payments/min, 1,00,000 INR/day) are the product values.
  fraud-service:
    build:
      context: ..
      dockerfile: services/fraud-service/Dockerfile
    ports:
      - "8088:8088"
      - "9092:9092"
    environment:
      PORT: "8088"
      GRPC_PORT: "9092"
      FRAUD_DATABASE_URL: postgres://finverse:finverse@postgres:5432/fraud_db?sslmode=disable
      REDIS_ADDR: redis:6379
      AUTH_JWKS_URL: http://auth-service:8081/.well-known/jwks.json
      AUTH_JWT_ISSUER: https://auth.finverse.local
      AUTH_JWT_AUDIENCE: finverse-api
      FRONTEND_BASE_URL: http://localhost:5173
      FRAUD_VELOCITY_MAX_PER_MIN: "100000"
      FRAUD_DAILY_LIMIT_MINOR: "1000000000000"
      LOG_LEVEL: debug
      ENVIRONMENT: development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8088/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Phase 3: Audit Service - append-only record of every catalog event.
  audit-service:
    build:
      context: ..
      dockerfile: services/audit-service/Dockerfile
    ports:
      - "8087:8087"
    environment:
      PORT: "8087"
      AUDIT_DATABASE_URL: postgres://finverse:finverse@postgres:5432/audit_db?sslmode=disable
      REDIS_ADDR: redis:6379
      AUTH_JWKS_URL: http://auth-service:8081/.well-known/jwks.json
      AUTH_JWT_ISSUER: https://auth.finverse.local
      AUTH_JWT_AUDIENCE: finverse-api
      FRONTEND_BASE_URL: http://localhost:5173
      LOG_LEVEL: debug
      ENVIRONMENT: development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8087/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Phase 5 pulled forward for tracing (NFR-OBS-1): Jaeger UI on :16686,
  # OTLP/HTTP ingest on :4318. Services never depend on it being up.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"
    restart: unless-stopped

  # Metrics: Prometheus scrapes every service's /metrics; Grafana provisions the
  # datasource and dashboards from docker/observability/. Grafana is on
  # localhost:3001 (anonymous viewer, local only), Prometheus on localhost:9090.
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - alertmanager
    ports:
      - "9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    depends_on:
      - alert-sink
    restart: unless-stopped

  # Local stand-in for a pager: prints each delivered alert (see observability/alert_sink.py).
  alert-sink:
    image: python:3.12-alpine
    command: python -u /app/alert_sink.py
    volumes:
      - ./observability/alert_sink.py:/app/alert_sink.py:ro
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yml:ro
    ports:
      - "3100:3100"
    restart: unless-stopped

  # Tails every compose container's stdout via the Docker socket (local only).
  promtail:
    image: grafana/promtail:3.2.1
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./observability/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # Load tests: `docker compose --profile loadtest run --rm k6 run /scripts/<file>.js`
  # (see loadtest/README.md). Not started by a plain `up`.
  k6:
    profiles: ["loadtest"]
    image: grafana/k6:0.54.0
    volumes:
      - ../loadtest:/scripts:ro
    environment:
      AUTH_URL: http://auth-service:8081
      CUSTOMER_URL: http://customer-service:8082
      ACCOUNT_URL: http://account-service:8083
      PAYMENT_URL: http://payment-service:8085
      NOTIFICATION_URL: http://notification-service:8086
    depends_on:
      - payment-service
      - notification-service

volumes:
  postgres_data:
  auth_keys:
  customer_documents:
