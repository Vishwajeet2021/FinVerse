name: frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"

defaults:
  run:
    working-directory: frontend

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run check --if-present
      - run: npm run build

      # docs/15-cicd-pipeline.md §4: Lighthouse CI enforces NFR-PERF-7 as an
      # automated gate — added once there's a deployed preview to point it
      # at (Phase 4); a static build has nothing to measure yet.
